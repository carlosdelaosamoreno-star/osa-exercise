<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Osa Exercise</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1730">
<style>body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding-top:14vh;box-sizing:border-box;background:#0b1730;color:#eef2f8;font:18px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
form{width:min(340px,90vw);display:grid;gap:14px;background:#13254a;border:1px solid #24406f;border-top:3px solid #e03a3a;border-radius:14px;padding:20px}h1{font-size:24px;margin:0 0 4px;text-align:center;font-weight:800}
.pw{display:flex;gap:6px}input[type=password],input[type=text]{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid #24406f;background:#0e1d3c;color:#fff;font-size:18px;min-height:48px}
button{min-height:48px;padding:12px;border:0;border-radius:10px;background:#e03a3a;color:#fff;font-size:18px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#eye{background:#1d3462;min-width:52px}
#m{min-height:1.2em;color:#ffb3b3;text-align:center;font-size:15px}label{font-size:16px;display:flex;gap:10px;align-items:center;cursor:pointer;min-height:44px}label input{width:24px;height:24px}
:focus-visible{outline:3px solid #4ea3ff;outline-offset:2px}</style></head>
<body><form id="f"><h1>🏋️ Osa Exercise</h1><div class="pw"><input id="p" type="password" autocomplete="current-password" placeholder="Contraseña" required aria-label="Contraseña"><button type="button" id="eye" aria-label="Mostrar contraseña" onclick="const p=document.getElementById('p');p.type=p.type==='password'?'text':'password';this.setAttribute('aria-label',p.type==='password'?'Mostrar contraseña':'Ocultar contraseña');this.textContent=p.type==='password'?'👁':'🙈'">👁</button></div>
<label for="r"><input id="r" type="checkbox"> Recordar en este dispositivo</label><button id="b">Entrar</button><div id="m" aria-live="polite"></div></form>
<script src="lock.js"></script></body></html>
