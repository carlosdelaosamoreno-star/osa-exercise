<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Osa Exercise</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1730">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1730;color:#e8eefc;font:16px system-ui,sans-serif}
form{width:min(320px,90vw);display:grid;gap:12px}h1{font-size:22px;margin:0 0 8px;text-align:center}
input[type=password]{padding:12px;border-radius:8px;border:1px solid #345;background:#12224a;color:#fff;font-size:16px}
button{padding:12px;border:0;border-radius:8px;background:#3d7bff;color:#fff;font-size:16px}button:disabled{opacity:.5}
#m{min-height:1.2em;color:#ffb3b3;text-align:center;font-size:14px}label{font-size:14px}</style></head>
<body><form id="f"><h1>🔒 Osa Exercise</h1><input id="p" type="password" autocomplete="current-password" placeholder="Contraseña" required autofocus>
<label><input id="r" type="checkbox"> Recordar en este dispositivo</label><button id="b">Entrar</button><div id="m"></div></form>
<script src="lock.js"></script></body></html>
